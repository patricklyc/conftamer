[project]
name = "contexttrack"
version = "0.2.0"
description = "Typed normalization of ContextTrack HTTP captures"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Patrick Lau", email = "patricklyc@berkeley.edu" }]
dependencies = ["pydantic>=2.13.5,<3"]

[project.scripts]
contexttrack = "contexttrack.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
