[project]
name = "contexttrack"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Patrick Lau", email = "patricklyc@berkeley.edu" }]
dependencies = [
  "pydantic>=2.13.5",
]

[project.scripts]
contexttrack = "contexttrack:main"

[dependency-groups]
dev = [
  "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
